<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarjeta digital</title>
<meta name="theme-color" content="#1F5FAE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Tarjeta digital de comercial: foto a sangre arriba, acciones rápidas, «¿en qué te ayudo?» y tarjeta que gira con el QR */
:root{
  --c1:#1F5FAE; --c2:#2A8AD8; --bg:#F4F7FB; --fg:#14243A; --muted:#5B6B80; --surface:#FFFFFF; --line:#DCE4EE;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#0D1622;--fg:#E8EEF6;--muted:#9AA9BC;--surface:#152233;--line:#24364C;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.45}
button,a{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* Portada con foto */
.hero{position:relative;aspect-ratio:4/4.6;max-width:100%;overflow:hidden;background:var(--c1)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;filter:grayscale(1) contrast(1.05);mix-blend-mode:luminosity;opacity:.95;transform:scale(1.04);animation:zoom 1.4s ease-out forwards}
@keyframes zoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 35%,color-mix(in srgb,var(--c1) 55%,transparent) 70%,var(--c1) 100%)}
.hero .id{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;padding-bottom:44px}
.hero .org{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.9}
.hero h1{font-size:2.2rem;line-height:1.05;margin:6px 0 4px;font-weight:800;letter-spacing:-.01em}
.hero .role{font-size:.95rem;font-weight:500;opacity:.92}
.badge{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:2;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:var(--c1);border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:700}
.badge i{width:8px;height:8px;border-radius:50%;background:#2BB673;box-shadow:0 0 0 0 rgba(43,182,115,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,182,115,0)}100%{box-shadow:0 0 0 0 rgba(43,182,115,0)}}

/* Acciones */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-26px;position:relative;z-index:3}
.act{display:grid;justify-items:center;gap:6px;text-decoration:none;font-size:.74rem;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px;box-shadow:0 6px 18px rgba(20,36,58,.08);cursor:pointer}
.act svg{width:24px;height:24px;stroke:var(--c1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act.wa svg{stroke:#1FAF5B}
.act:active{transform:scale(.97)}

.sec{margin-top:26px;display:grid;gap:12px}
.sec h2{font-size:1.05rem;margin:0;font-weight:700}
.greet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.greet img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 15%;filter:grayscale(1)}
.greet p{margin:0;font-size:.95rem}
.greet .typing{color:var(--muted);font-style:italic;font-size:.9rem}

.help{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help a{display:grid;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s}
.help a:active,.help a:hover{border-color:var(--c2)}
.help b{font-size:.95rem}
.help span{font-size:.78rem;color:var(--muted)}
.help em{font-style:normal;font-size:1.3rem}

.bio{font-size:.95rem;color:var(--muted);margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}

/* Tarjeta que gira */
.flip{perspective:1200px;cursor:pointer}
.flip-in{position:relative;aspect-ratio:85/55;max-width:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 30px rgba(20,36,58,.18)}
.front{background:linear-gradient(160deg,#fff 0%,#fff 35%,var(--c2) 75%,var(--c1) 100%);display:grid;grid-template-columns:42% 1fr}
.front img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:grayscale(1);mix-blend-mode:multiply}
.front .t{align-self:end;padding:14px;color:#fff;display:grid;gap:2px}
.front .t b{font-size:1.1rem}
.front .t span{font-size:.72rem;opacity:.95}
.front .t i{font-style:normal;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;margin-top:6px;opacity:.9}
.back{background:#fff;transform:rotateY(180deg);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;color:#14243A}
.back .qr{width:min(42vw,170px);aspect-ratio:1}
.back .qr svg{width:100%;height:100%;display:block}
.back b{display:block;font-size:.95rem;color:var(--c1)}
.back span{font-size:.75rem;color:#5B6B80}
.hint{font-size:.78rem;color:var(--muted);text-align:center}

.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--c1);color:#fff}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.foot{margin-top:26px;text-align:center;font-size:.72rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:10}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.hero img,.badge i{animation:none}.hero img{transform:none}.flip-in{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img id="photo" alt="">
    <span class="badge"><i></i><span id="status">Disponible</span></span>
    <div class="id pad"><div class="org" id="org"></div><h1 id="name"></h1><div class="role" id="role"></div></div>
  </header>

  <div class="pad">
    <nav class="actions" aria-label="Contactar">
      <a class="act" id="a-call"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Llamar</a>
      <a class="act wa" id="a-wa"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg>WhatsApp</a>
      <a class="act" id="a-mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email</a>
      <a class="act" id="a-save"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M19 3v6M16 6h6"/></svg>Guardar</a>
    </nav>

    <section class="sec">
      <div class="greet"><img id="avatar" alt=""><div><p id="greet-txt" class="typing">escribiendo…</p></div></div>
    </section>

    <section class="sec">
      <h2>¿En qué te ayudo?</h2>
      <div class="help" id="help"></div>
    </section>

    <section class="sec" id="about">
      <h2>Sobre mí</h2>
      <p class="bio" id="bio"></p>
      <div class="facts" id="facts"></div>
    </section>

    <section class="sec">
      <h2>Mi tarjeta</h2>
      <div class="flip" id="flip" role="button" tabindex="0" aria-label="Girar la tarjeta">
        <div class="flip-in">
          <div class="face front"><img id="card-photo" alt=""><div class="t"><b id="card-name"></b><span id="card-role"></span><i id="card-org"></i></div></div>
          <div class="face back"><div class="qr" id="qr"></div><div><b>Escanea para guardarme</b><span id="qr-txt"></span></div></div>
        </div>
      </div>
      <p class="hint">Toca la tarjeta para darle la vuelta y que te escaneen el QR.</p>
      <div class="share">
        <button class="btn" id="share" type="button">Compartir tarjeta</button>
        <a class="btn ghost" id="web" target="_blank" rel="noopener">Ver web</a>
      </div>
    </section>

    <p class="foot" id="foot"></p>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script id="config" type="application/json">/*CONFIG*/</script>
<script>
(function(){
"use strict";
const C=JSON.parse(document.getElementById("config").textContent);
const $=id=>document.getElementById(id);
const full=(C.nombre+" "+(C.apellidos||"")).trim();
const tel=String(C.telefono||"").replace(/[^\d+]/g,"");
const wa=String(C.whatsapp||C.telefono||"").replace(/\D/g,"");
const waLink=msg=>"https://wa.me/"+wa+(msg?"?text="+encodeURIComponent(msg):"");
document.documentElement.style.setProperty("--c1",C.color||"#1F5FAE");
document.documentElement.style.setProperty("--c2",C.color2||"#2A8AD8");
document.title=full+" · "+(C.empresa||"");
document.querySelector('meta[name="theme-color"]').content=C.color||"#1F5FAE";
["photo","avatar","card-photo"].forEach(id=>{$(id).src=C.foto;});
$("photo").alt="Foto de "+full;
$("org").textContent=C.empresa||"";$("name").textContent=full;$("role").textContent=C.cargo||"";
$("card-name").textContent=full;$("card-role").textContent=C.cargo||"";$("card-org").textContent=C.empresa||"";
$("a-call").href="tel:"+tel;
$("a-wa").href=waLink(C.saludo_whatsapp||("Hola "+C.nombre+", te escribo desde tu tarjeta digital."));$("a-wa").target="_blank";$("a-wa").rel="noopener";
if(C.email)$("a-mail").href="mailto:"+C.email;else $("a-mail").hidden=true;
$("a-save").href=C.vcf||"contacto.vcf";$("a-save").setAttribute("download",(full.replace(/\s+/g,"-")||"contacto")+".vcf");
if(C.web){$("web").href=C.web;}else $("web").hidden=true;
// Saludo con efecto de escritura
const greet=C.saludo||("Hola, soy "+C.nombre+". ¿En qué puedo ayudarte?");
setTimeout(()=>{const p=$("greet-txt");p.className="";p.textContent="";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){p.textContent=greet;return;}
  let i=0;const t=setInterval(()=>{p.textContent=greet.slice(0,++i);if(i>=greet.length)clearInterval(t);},22);},700);
// Estado según horario
const h=new Date().getHours(),d=new Date().getDay();
const open=(C.horario||[9,20]);const avail=d!==0&&h>=open[0]&&h<open[1];
$("status").textContent=avail?"Disponible ahora":"Te respondo pronto";
// ¿En qué te ayudo?
(C.servicios||[]).forEach(s=>{const a=document.createElement("a");a.href=waLink(s.mensaje);a.target="_blank";a.rel="noopener";
  const em=document.createElement("em");em.textContent=s.icono||"→";const b=document.createElement("b");b.textContent=s.titulo;const sp=document.createElement("span");sp.textContent=s.detalle||"";
  a.append(em,b,sp);$("help").append(a);});
// Sobre mí
if(C.bio){$("bio").textContent=C.bio;}else $("about").hidden=true;
(C.datos||[]).forEach(t=>{const s=document.createElement("span");s.textContent=t;$("facts").append(s);});
// Tarjeta que gira
$("qr").innerHTML=C.qr_svg||"";$("qr-txt").textContent=C.qr_texto||"Se guarda en tu agenda en un toque.";
const flip=$("flip");const toggle=()=>flip.classList.toggle("on");
flip.addEventListener("click",toggle);flip.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
// Compartir
let tt;const toast=t=>{const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600);};
$("share").addEventListener("click",async()=>{const url=C.url||location.href;
  if(navigator.share){try{await navigator.share({title:full,text:full+" · "+(C.empresa||""),url});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(url);toast("Enlace copiado");}catch(e){toast(url);}});
$("foot").textContent=(C.empresa||"")+(C.pie?" · "+C.pie:"");
})();
</script>
</body>
</html>
